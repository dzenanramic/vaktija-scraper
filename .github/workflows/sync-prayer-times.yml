name: Sync Prayer Times

on:
    schedule:
        # Svaku ponoć po srednjoevropskom vremenu (CET = UTC+1, CEST = UTC+2)
        # Ljeti: 22:00 UTC = 00:00 CEST
        # Zimi:  23:00 UTC = 00:00 CET
        # Koristimo 22:00 — zimi će biti sat ranije (23:00 CET), ljeti tačno u ponoć
        - cron: "0 22 * * *"
    workflow_dispatch: # Ručno pokretanje

jobs:
    sync:
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install dependencies
              run: pip install httpx pydantic supabase

            - name: Sync prayer times
              env:
                  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
                  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
              run: |
                  python scripts/sync-to-supabase.py --slug landsberg-am-lech -v
