[project]
name = "vaktija-scraper"
version = "0.1.0"
description = "Scraper za namaska vremena sa vaktija.eu"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "supabase>=2.0.0",
]

[project.scripts]
vaktija = "vaktija_scraper.cli:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
